# ---------------------------------------------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------------------------------------------
[project]
name = "wildfire-geo-ml"
version = "0.1.0"
description = "Cloud-native geospatial ML pipeline for PG&E vegetation encroachment risk scoring"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Amninder Singh" }]
license = { text = "MIT" }

dependencies = [
    # Geospatial core
    "rasterio>=1.3.10",
    "rioxarray>=0.17.0",
    "xarray>=2024.2.0",
    "geopandas>=0.14.3",
    "shapely>=2.0.3",
    "pyproj>=3.6.1",
    "fiona>=1.9.6",
    "pyarrow>=15.0.2",

    # COG tools
    "rio-cogeo>=5.3.0",

    # STAC
    "pystac[validation]>=1.10.0",
    "stac-validator>=3.3.2",
    "pystac-client>=0.7.6",

    # H3
    "h3>=3.7.7",

    # Dask for large array processing
    "dask[distributed]>=2024.3.0",

    # Apache Sedona
    "apache-sedona[spark]>=1.6.0",
    "pyspark>=3.5.1",

    # ML
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.1",
    "mlflow>=2.12.1",
    "shap>=0.47,<0.50",

    # AWS
    "boto3>=1.34.69",
    "botocore>=1.34.69",

    # Utilities
    "python-dotenv>=1.0.1",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "tqdm>=4.66.2",
    "click>=8.1.7",
    "pydantic>=2.6.0",  # typed config models for config/*.yaml
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
# Deployment-only deps; install via `uv sync --extra app`
app = []

# ---------------------------------------------------------------------------
# Dev dependency group (PEP 735) — install via `uv sync --group dev`
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "moto[s3]>=5.0.3",
    "ruff>=0.6.0",
    "ty>=0.0.1a1",            # Astral's type checker (replaces mypy)
    "pre-commit>=3.7.0",
    "marimo>=0.9.0",          # notebook scripts in notebooks/*.py
    "boto3-stubs[s3,emr-serverless]>=1.34.69",
    "pandas-stubs>=2.2.1",
]

# ---------------------------------------------------------------------------
# Build system (uv-managed, hatchling backend)
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildfire_geo_ml"]

# ---------------------------------------------------------------------------
# Ruff configuration
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks/", ".venv/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (enforce type hints on public APIs)
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["wildfire_geo_ml"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# ty configuration (Astral's type checker — replaces mypy)
# Defaults are sensible; override only the narrow scope below.
# ---------------------------------------------------------------------------
[tool.ty.src]
include = ["src"]

[tool.ty.rules]
# Tighten if too many false positives surface from geospatial stubs.

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:pystac",
    "ignore::UserWarning:rasterio",
]
